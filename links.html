<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACSES — Links</title>
<meta name="description" content="ACSES DKTE Official Links">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/portal/images/favicon.png">
<style>
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }
  
  .links-container {
    max-width: 600px;
    width: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .profile-section {
    text-align: center;
    margin-bottom: 32px;
  }

  .profile-logo {
    width: 120px;
    height: auto;
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .profile-title {
    font-family: 'Sora', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px 0;
    background: linear-gradient(to right, #fff, rgba(255,255,255,0.6));
    -webkit-background-clip: text;
    color: transparent;
  }

  .profile-bio {
    color: var(--ink-dim);
    font-size: 15px;
    margin: 0;
  }

  .link-card {
    display: flex;
    align-items: center;
    padding: 18px 24px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .link-card:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .link-card.primary {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(59, 130, 246, 0.1));
    border-color: rgba(56, 189, 248, 0.3);
  }
  
  .link-card.primary:hover {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(59, 130, 246, 0.2));
    border-color: rgba(56, 189, 248, 0.6);
  }

  .link-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 16px;
    font-size: 20px;
    color: var(--circuit);
  }

  .link-text {
    flex-grow: 1;
    font-size: 16px;
  }

  .link-arrow {
    opacity: 0.5;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .link-card:hover .link-arrow {
    opacity: 1;
    transform: translateX(4px);
  }

  .section-divider {
    margin: 32px 0 16px;
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }

  .section-divider::before,
  .section-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .section-divider::before { margin-right: 16px; }
  .section-divider::after { margin-left: 16px; }

  /* Background elements matching index.html */
  #circuitPattern {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.2;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }
  
  .orb-1 { width: 300px; height: 300px; background: rgba(56, 189, 248, 0.3); top: -100px; left: -100px; }
  .orb-2 { width: 400px; height: 400px; background: rgba(139, 92, 246, 0.2); bottom: -200px; right: -100px; }
</style>
</head>
<body>

<div id="circuitPattern"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="links-container">
  
  <div class="profile-section">
    <img src="assets/portal/images/logo.png" alt="ACSES Logo" class="profile-logo">
    <h1 class="profile-title">ACSES DKTE</h1>
    <p class="profile-bio">Association of Computer Science & Engineering Students</p>
  </div>

  <a href="https://tinyurl.com/acsesmembership" class="link-card primary" target="_blank" rel="noopener">
    <div class="link-icon"><i class="fa-solid fa-user-plus"></i></div>
    <div class="link-text">Register as a Member</div>
    <div class="link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
  </a>

  <a href="index.html" class="link-card">
    <div class="link-icon"><i class="fa-solid fa-globe"></i></div>
    <div class="link-text">Official Website</div>
    <div class="link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
  </a>

  <div class="section-divider">Socials</div>

  <a href="https://www.instagram.com/acses_dkte/" class="link-card" target="_blank" rel="noopener">
    <div class="link-icon" style="color: #E1306C;"><i class="fa-brands fa-instagram"></i></div>
    <div class="link-text">Instagram</div>
    <div class="link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
  </a>

  <a href="https://www.linkedin.com/company/acses-association-of-computer-science-and-engineering-students/" class="link-card" target="_blank" rel="noopener">
    <div class="link-icon" style="color: #0077B5;"><i class="fa-brands fa-linkedin"></i></div>
    <div class="link-text">LinkedIn</div>
    <div class="link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
  </a>

  <a href="https://github.com/acses-dkte" class="link-card" target="_blank" rel="noopener">
    <div class="link-icon" style="color: #ffffff;"><i class="fa-brands fa-github"></i></div>
    <div class="link-text">GitHub</div>
    <div class="link-arrow"><i class="fa-solid fa-chevron-right"></i></div>
  </a>

  <div class="section-divider">Contact Us</div>

  <a href="tel:+919055721797" class="link-card">
    <div class="link-icon"><i class="fa-solid fa-phone"></i></div>
    <div class="link-text">Krish Mahajan (President)</div>
    <div class="link-arrow"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px;"></i></div>
  </a>

  <a href="tel:+919325324272" class="link-card">
    <div class="link-icon"><i class="fa-solid fa-phone"></i></div>
    <div class="link-text">Gomtesh Patil (Vice President)</div>
    <div class="link-arrow"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px;"></i></div>
  </a>

</div>

</body>
</html>
