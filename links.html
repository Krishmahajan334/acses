<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Crucial for mobile optimization -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ACSES — Links</title>
<meta name="description" content="ACSES DKTE Official Links">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* Mobile-first specific overrides for the links page */
  body {
    background-color: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100svh; /* svh for better mobile rendering */
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  
  .links-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 580px;
    padding: 60px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0 auto;
  }

  /* Profile Header */
  .profile-section {
    text-align: center;
    margin-bottom: 24px;
    animation: fadeUp .8s cubic-bezier(.16,.8,.28,1) forwards;
  }

  .profile-logo {
    height: 56px;
    width: auto;
    margin-bottom: 24px;
    object-fit: contain;
  }

  .profile-title {
    font-family: var(--display);
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  
  .profile-title span {
    color: var(--circuit);
  }

  .profile-bio {
    color: var(--ink-dim);
    font-size: 14.5px;
    margin: 0;
    line-height: 1.5;
  }

  /* Re-using the glass card (gcard) concept for links */
  .link-card {
    display: flex;
    align-items: center;
    padding: 18px 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    transition: transform .25s ease-out, border-color .3s ease, box-shadow .3s ease, background .3s ease;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp .8s cubic-bezier(.16,.8,.28,1) forwards;
  }

  .link-card:nth-child(1) { animation-delay: 0.1s; }
  .link-card:nth-child(2) { animation-delay: 0.15s; }
  .link-card:nth-child(3) { animation-delay: 0.2s; }
  .link-card:nth-child(4) { animation-delay: 0.25s; }
  .link-card:nth-child(5) { animation-delay: 0.3s; }
  .link-card:nth-child(6) { animation-delay: 0.35s; }
  .link-card:nth-child(7) { animation-delay: 0.4s; }

  .link-card:hover {
    border-color: rgba(76,141,255,.5); 
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.6);
    transform: translateY(-2px);
    background: rgba(255,255,255,0.06);
  }

  /* The primary / highlight link */
  .link-card.primary {
    background: linear-gradient(135deg, rgba(76,141,255,0.15), rgba(76,255,178,0.1));
    border-color: rgba(76,141,255,.4);
  }
  
  .link-card.primary:hover {
    background: linear-gradient(135deg, rgba(76,141,255,0.25), rgba(76,255,178,0.15));
    border-color: var(--circuit);
    box-shadow: 0 12px 30px -10px rgba(76,141,255,.3);
  }

  .link-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 18px;
    font-size: 16px;
    color: var(--ink);
    flex-shrink: 0;
  }
  
  .link-card.primary .link-icon {
    background: linear-gradient(135deg, var(--blue), var(--circuit));
    color: #07090A;
    border: none;
  }

  .link-text {
    flex-grow: 1;
    font-size: 15.5px;
  }

  .link-arrow {
    opacity: 0.4;
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-size: 14px;
  }

  .link-card:hover .link-arrow {
    opacity: 1;
    transform: translateX(4px);
    color: var(--circuit);
  }

  .section-divider {
    margin: 32px 0 8px;
    display: flex;
    align-items: center;
    text-align: center;
    font-family: var(--mono);
    color: var(--circuit);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    opacity: 0;
    animation: fadeUp .8s cubic-bezier(.16,.8,.28,1) forwards;
    animation-delay: 0.2s;
  }

  .section-divider::before,
  .section-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--line);
  }

  .section-divider::before { margin-right: 16px; }
  .section-divider::after { margin-left: 16px; }
  
  /* Footer text */
  .links-footer {
    text-align: center;
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    opacity: 0;
    animation: fadeUp .8s cubic-bezier(.16,.8,.28,1) forwards;
    animation-delay: 0.5s;
  }

  @keyframes fadeUp { 
    from { opacity: 0; transform: translateY(16px); } 
    to { opacity: 1; transform: translateY(0); } 
  }

</style>
</head>
